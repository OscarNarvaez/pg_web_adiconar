  <!--
    CSP vía meta tag (GitHub Pages no permite headers HTTP custom, así que
    esta es la única forma disponible sin poner un CDN delante). No cubre
    frame-ancestors/X-Frame-Options (el spec de CSP ignora esas directivas
    cuando vienen de un <meta>, solo funcionan como header real) — es
    defensa en profundidad contra inyección de <script>, no protección
    contra clickjacking. img-src queda permisivo a propósito: el catálogo
    y las noticias enlazan imágenes de muchos dominios de proveedores/prensa
    fuera de nuestro control.
  -->
